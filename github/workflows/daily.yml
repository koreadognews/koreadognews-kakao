
name: Korean Pet Industry Daily

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      send_kakao:
        description: 'Send Kakao message after publishing?'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: newsletter-pages
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5-mini
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate newsletter
        run: python bot.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages files
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published newsletter
        shell: bash
        run: |
          DAY=$(TZ=Asia/Seoul date -d yesterday +%F)
          URL="${PUBLIC_BASE_URL%/}/${DAY}.html"
          for i in $(seq 1 20); do
            if curl --fail --silent --location "$URL" \
              | grep -q "기사 기준일 ${DAY}"; then
              exit 0
            fi
            sleep 15
          done
          echo "Newsletter page not available"
          exit 1

      - name: Send Kakao
        if: ${{ github.event_name == 'schedule' || inputs.send_kakao == true }}
        run: python bot.py --send-only --send

