name: Korean Pet Industry - Fix Government RSS Dates (Test Only)

'on':
  push:
    branches: [test-safety]
    paths:
      - '.github/workflows/rss-government-date-fix.yml'
  workflow_dispatch:

# Changes only test-safety/feed_collector.py and trial RSS candidate archives.
# Never touches main, daily.yml, OpenAI API, Kakao, or production issues.
permissions:
  contents: write

concurrency:
  group: rss-archive-pilot-test-safety
  cancel-in-progress: false

jobs:
  fix-rss-dates:
    if: github.ref == 'refs/heads/test-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out test-safety only
        uses: actions/checkout@v4
        with:
          ref: test-safety
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch only the RSS candidate date decoder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('feed_collector.py')
          source = path.read_text(encoding='utf-8')
          new_function = '''# Only these original Korean government publishers use timezone-less local RSS dates.
          # The inferred timestamp is a CANDIDATE, not a verified original publication time.
          KST_ASSUMED_SOURCES = frozenset({
              '농림축산식품부 보도자료', '중소벤처기업부 보도자료'
          })


          def _date(text, *, assume_kst=False):
              if not text:
                  return None
              raw = text.strip()
              # Korean weekday and month names with explicit KST (e.g. MOIS).
              korean = re.fullmatch(
                  r'(?:[월화수목금토일],\\s*)?(\\d{1,2})\\s+(\\d{1,2})월\\s+(\\d{4})\\s+(\\d{2}:\\d{2}:\\d{2})\\s+KST',
                  raw
              )
              if korean:
                  day, month, year, hhmmss = korean.groups()
                  try:
                      parsed = dt.datetime.strptime(
                          f'{year}-{int(month):02d}-{int(day):02d} {hhmmss}',
                          '%Y-%m-%d %H:%M:%S'
                      )
                      return parsed.replace(tzinfo=TZ)
                  except ValueError:
                      return None
              try:
                  value = dt.datetime.fromisoformat(raw.replace('Z', '+00:00'))
              except ValueError:
                  try:
                      # MSS uses YYYYMMDDHHMMSS, without an offset.
                      value = dt.datetime.strptime(raw, '%Y%m%d%H%M%S')
                  except ValueError:
                      try:
                          value = email.utils.parsedate_to_datetime(raw)
                      except (TypeError, ValueError, IndexError):
                          return None
              if value.tzinfo is None or value.utcoffset() is None:
                  # Never silently assume a timezone for unapproved sources.
                  return value.replace(tzinfo=TZ) if assume_kst else None
              return value.astimezone(TZ)
          '''
          marker = "timestamp = _date(_field(entry, {'published', 'pubDate', 'date', 'issued'}))"
          updated = ("timestamp = _date(_field(entry, {'published', 'pubDate', 'date', 'issued'}), "
                     "assume_kst=source.get('publisher') in KST_ASSUMED_SOURCES)")
          begin = source.find('def _date(text):\n')
          end = source.find('\n\ndef _item_link', begin)
          if begin < 0 or end < 0 or source.count(marker) != 1:
              if 'KST_ASSUMED_SOURCES' in source and updated in source:
                  print('DATE_FIX_ALREADY_APPLIED')
              else:
                  raise RuntimeError('Original source layout changed: no code replaced; request review')
          else:
              source = source[:begin] + new_function + source[end:]
              source = source.replace(marker, updated, 1)
              path.write_text(source, encoding='utf-8')
              print('DATE_FIX_PATCHED')
          PY
      - name: Check syntax, original offline tests, and government date examples
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile feed_collector.py rss_archive.py bot.py
          python rss_archive.py --selftest
          python -m unittest discover -s tests -p 'test_*.py' -v
          python - <<'PY'
          import datetime as dt
          import feed_collector as f
          tests = (
              ('2026-11-06 18:50:15.843', True, '2026-11-06T18:50:15.843000+09:00'),
              ('20261106153120', True, '2026-11-06T15:31:20+09:00'),
              ('금, 06 11월 2026 12:00:00 KST', False, '2026-11-06T12:00:00+09:00'),
              ('Fri, 06 Nov 2026 12:00:00 +0900', False, '2026-11-06T12:00:00+09:00'),
          )
          for raw, kst_allowed, expected in tests:
              got = f._date(raw, assume_kst=kst_allowed)
              assert got is not None and got.isoformat() == expected, (raw, got, expected)
          for raw in ('2026-11-06 18:50:15.843', '20261106153120'):
              assert f._date(raw) is None, 'Timezoneless dates must be source-specific'
          print('DATE_FIX_TESTS_PASSED')
          PY
      - name: Collect test RSS article candidates (not verified for publishing)
        shell: bash
        run: python rss_archive.py --collect
      - name: Commit validated test-only fix and candidate archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed_collector.py
          if [ -d data/rss_archive ]; then
            git add data/rss_archive/
          fi
          if git diff --cached --quiet; then
            echo 'DATE_FIX_NO_CHANGE'
            exit 0
          fi
          git commit -m 'Parse Korean government RSS date formats [skip ci]'
          git pull --rebase origin test-safety
          git push origin HEAD:test-safety
          echo 'DATE_FIX_COMMITTED_TEST_SAFETY_ONLY'
