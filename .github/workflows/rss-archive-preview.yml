name: Korean Pet Industry - Archived RSS Newsletter Preview (Test Only)
'on':
  push:
    branches: [test-safety]
    paths:
      - '.github/workflows/rss-archive-preview.yml'
  workflow_dispatch:

# Read-only test: no edits to main, daily.yml, docs/, archives or Kakao ledger.
permissions:
  contents: read

jobs:
  verify-and-preview:
    if: github.ref == 'refs/heads/test-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout test-safety without write credentials
        uses: actions/checkout@v4
        with:
          ref: test-safety
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3'

      - name: Verify archive safety tests
        run: |
          python -m py_compile bot.py feed_collector.py rss_archive.py
          python rss_archive.py --selftest

      - name: Verify original publication times and create preview without sending
        env:
          OPENAI_API_KEY: ''
          KAKAO_REST_API_KEY: ''
          KAKAO_REFRESH_TOKEN: ''
          KAKAO_CLIENT_SECRET: ''
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          from rss_archive import load_for_issue
          from bot import create_issue, render_text, bounds

          # Known archived issue, used only for the first integration test.
          # This is not the current day's production newsletter.
          issue = dt.date(2026, 11, 6)
          candidates = load_for_issue(issue)
          start, end = bounds(issue)
          print('PREVIEW_WINDOW start={} end_exclusive={}'.format(start.isoformat(), end.isoformat()), flush=True)
          print('PREVIEW_CANDIDATES domestic={} supplement={} overseas={} events={}'.format(
              len(candidates['domestic_industry']),
              len(candidates['domestic_supplement']),
              len(candidates['overseas']),
              len(candidates['events'])
          ), flush=True)
          if not any(candidates[key] for key in ('domestic_industry', 'domestic_supplement', 'overseas')):
              raise RuntimeError('No saved news candidates for test issue; no preview created')

          # This verifies each article's first-publication timestamp against
          # its original publisher. It does NOT call any OpenAI or Kakao method.
          record = create_issue(issue, candidates=candidates)
          assert record['issue_date'] == issue.isoformat()
          for section in ('domestic_industry', 'domestic_supplement', 'overseas'):
              for article in record[section]:
                  assert article['verification'] == 'source_metadata'
                  assert article['url'].startswith('https://')

          draft = render_text(record)
          output = Path('preview-output')
          output.mkdir(exist_ok=True)
          (output / 'newsletter-preview.txt').write_text(
              '시험용 초안 — 발송 금지 / NOT PUBLISHED\n\n' + draft, encoding='utf-8'
          )
          (output / 'newsletter-preview.json').write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print('PREVIEW_VERIFIED domestic={} supplement={} overseas={} events={}'.format(
              len(record['domestic_industry']),
              len(record['domestic_supplement']),
              len(record['overseas']),
              len(record['events'])
          ), flush=True)
          for section in ('domestic_industry', 'domestic_supplement', 'overseas'):
              for article in record[section]:
                  print('PREVIEW_ARTICLE ' + json.dumps({
                      'section': section,
                      'title': article['title'],
                      'publisher': article['publisher'],
                      'published_at': article['published_at'],
                      'url': article['url']
                  }, ensure_ascii=False), flush=True)
          print('PREVIEW_COMPLETE read_only=true kakao_sent=false openai_called=false', flush=True)
          PY

      - name: Save preview as downloadable GitHub Actions artifact only
        uses: actions/upload-artifact@v4
        with:
          name: rss-newsletter-preview-2026-11-06
          path: preview-output/
          if-no-files-found: error
          retention-days: 7
