name: Korean Pet Industry - Select Productive RSS Feeds (Test Only)

'on':
  push:
    branches: [test-safety]
    paths:
      - '.github/workflows/rss-discovery-feed-promotion.yml'
  workflow_dispatch:

# This is a one-shot, test-branch-only source configuration change.
# No OpenAI, Kakao, production publication or changes to main/daily.yml.
permissions:
  contents: write

concurrency:
  group: rss-archive-pilot-test-safety
  cancel-in-progress: false

jobs:
  promote-candidate-sources-to-test-only:
    if: github.ref == 'refs/heads/test-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out test-safety only
        uses: actions/checkout@v4
        with:
          ref: test-safety
          fetch-depth: 0
          persist-credentials: true
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing test dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit three productive feeds, prevent duplicates, and stage test config
        env:
          OPENAI_API_KEY: ''
          KAKAO_REST_API_KEY: ''
          KAKAO_REFRESH_TOKEN: ''
          KAKAO_CLIENT_SECRET: ''
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from urllib.parse import urlsplit
          from zoneinfo import ZoneInfo
          import xml.etree.ElementTree as ET

          import requests
          import bot
          import feed_collector as fc
          from rss_archive import ARCHIVE, _read_day

          # Curated from the 2026-11-06 diagnostics: at least one potential pet
          # article per feed. Choose one feed per publisher, avoiding overlap
          # between Herald's culture feed and its wider all-news feed.
          # Exact Herald test publisher name is required by the verified parser.
          choices = [
              {'publisher':'뉴시스 문화 추가시험', 'category':'domestic',
               'url':'https://www.newsis.com/RSS/culture.xml',
               'hosts':['www.newsis.com','newsis.com','nwww.newsis.com'], 'enabled':True},
              {'publisher':'한국경제 전체 추가시험', 'category':'domestic',
               'url':'https://www.hankyung.com/feed/all-news',
               'hosts':['www.hankyung.com','hankyung.com'], 'enabled':True},
              {'publisher':'헤럴드경제 전체 추가시험', 'category':'domestic',
               'url':'https://biz.heraldcorp.com/rss/google/newsAll',
               'hosts':['biz.heraldcorp.com'], 'enabled':True},
          ]
          now = dt.datetime.now(ZoneInfo('Asia/Seoul'))
          start, end = now - dt.timedelta(days=8), now + dt.timedelta(minutes=2)
          config_path = Path('feeds.json')
          cfg = json.loads(config_path.read_text(encoding='utf-8'))
          original = cfg['feeds']
          before = len(original)
          baseline_urls = {x['url'] for x in original}
          if len(baseline_urls) != before:
              raise RuntimeError('Existing duplicate feed URLs; no source changes')
          if before < 17:
              raise RuntimeError('Unexpected existing feed count; no source changes')

          archived = set()
          for days_before in range(9):
              day = now.date() - dt.timedelta(days=days_before)
              for rec in _read_day(ARCHIVE, day):
                  if isinstance(rec, dict) and isinstance(rec.get('url'), str):
                      parsed = urlsplit(rec['url'])
                      archived.add(((parsed.hostname or '').lower(), parsed.path.rstrip('/'), parsed.query))

          to_add = [f for f in choices if f['url'] not in baseline_urls]
          all_candidates = {}
          live_checked = []
          for feed in choices:
              response = requests.get(feed['url'], timeout=17,
                                      headers={'User-Agent':'KoreaDogNewsCuratedRSS/1.0'})
              response.raise_for_status()
              root = ET.fromstring(response.content)
              items = [n for n in root.iter() if n.tag.rsplit('}',1)[-1] in ('item','entry')]
              if not items:
                  raise RuntimeError('Empty RSS source: '+feed['publisher'])
              # An accessible URL alone is insufficient: require source dates and
              # direct first-party links, with no inferred dates for unknown hosts.
              dated_and_firstparty = 0
              for entry in items:
                  published = fc._source_date(entry, feed)
                  parsed = urlsplit(fc._source_link(entry, feed))
                  if published and parsed.scheme == 'https' and (parsed.hostname or '').lower() in feed['hosts']:
                      dated_and_firstparty += 1
              if dated_and_firstparty == 0:
                  raise RuntimeError('No dated original-publisher items: '+feed['publisher'])
              candidates = fc.parse_feed(response.content, feed, start, end)
              for category, article in candidates:
                  parsed = urlsplit(article['url'])
                  key = ((parsed.hostname or '').lower(), parsed.path.rstrip('/'), parsed.query)
                  if key not in all_candidates:
                      all_candidates[key] = (category, article)
              result = {'publisher':feed['publisher'], 'rss_items':len(items),
                        'dated_firstparty_items':dated_and_firstparty,
                        'pet_candidates_8days':len(candidates)}
              live_checked.append(result)
              print('CURATED_FEED_CHECK '+json.dumps(result,ensure_ascii=False),flush=True)

          # Original publisher metadata must agree with RSS before source config
          # is approved. These are *candidate* sources, not publishable editions.
          verification = []
          ordered = sorted(all_candidates.values(), key=lambda x:x[1]['published_at'],reverse=True)
          for category, article in ordered[:8]:
              status = 'no_match'
              try:
                  source_page = bot.get_source(article['url'])
                  claimed = bot.parse_aware_timestamp(article['published_at'])
                  publisher_times = bot.source_metadata_times(source_page)
                  if claimed and any(abs((t-claimed).total_seconds())<=120 for t in publisher_times):
                      status='timestamp_match'
              except (requests.RequestException, ValueError, UnicodeError) as exc:
                  status='original_unavailable_'+type(exc).__name__
              verification.append((article['publisher'],category,status))
              print('CURATED_ARTICLE_CHECK '+json.dumps({
                  'publisher':article['publisher'],'section':category,
                  'title':article['title'][:140],'status':status,
                  'already_in_archive':(
                      (urlsplit(article['url']).hostname or '').lower(),
                      urlsplit(article['url']).path.rstrip('/'),
                      urlsplit(article['url']).query
                  ) in archived
              },ensure_ascii=False),flush=True)
          if not verification or not any(status=='timestamp_match' for _,_,status in verification):
              raise RuntimeError('No current pet candidates matched publisher timestamps; config unchanged')

          # Discovery only: still requires full editorial relevance/rights check.
          # In particular, do NOT add these feeds to production/main here.
          if to_add:
              cfg['feeds'].extend(to_add)
              config_path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          actual = json.loads(config_path.read_text(encoding='utf-8'))['feeds']
          assert len(actual)==before+len(to_add)
          assert len({x['url'] for x in actual}) == len(actual)
          print('CURATED_SOURCE_RESULT '+json.dumps({
              'feeds_before':before,'added_to_test':len(to_add),
              'feeds_test_after':len(actual),
              'unique_pet_candidate_urls_8days':len(all_candidates),
              'original_timestamps_sampled':len(verification),
              'original_timestamps_matched':sum(x[2]=='timestamp_match' for x in verification),
              'not_republished':True,'not_sent_to_kakao':True,
              'commercial_republication_rights':'REVIEW_REQUIRED',
              'main_branch_unchanged':True
          },ensure_ascii=False),flush=True)
          PY
      - name: Regression tests after configuration change
        env:
          OPENAI_API_KEY: ''
          KAKAO_REST_API_KEY: ''
          KAKAO_REFRESH_TOKEN: ''
        run: |
          python -m py_compile feed_collector.py rss_archive.py bot.py
          python rss_archive.py --selftest
          python -m unittest discover -s tests -p 'test_*.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('feeds.json').read_text(encoding='utf-8'))['feeds']
          assert len(data)==20, f'Expected existing 17 + selected 3, found {len(data)}'
          assert len({s['url'] for s in data})==20
          assert all(s['category']=='domestic' for s in data[-3:])
          print('CURATED_RSS_20_SOURCES_TEST_PASSED',flush=True)
          PY
      - name: Commit validated feed configuration to test-safety only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- feeds.json
          if git diff --cached --quiet; then
            echo 'CURATED_FEEDS_ALREADY_PRESENT_IN_TEST_SAFETY'
            exit 0
          fi
          git commit -m 'Add three validated RSS discovery sources to test-safety [skip ci]'
          git pull --rebase origin test-safety
          git push origin HEAD:test-safety
          echo 'CURATED_FEEDS_COMMITTED_TEST_SAFETY_ONLY'
