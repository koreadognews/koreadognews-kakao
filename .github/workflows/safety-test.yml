name: Korean Pet Industry Safety Test

on:
  push:
    branches:
      - test-safety
    paths:
      - 'bot.py'
      - 'send_once.py'
      - 'sync_kakao_token.py'
      - 'tests/**'
      - '.github/workflows/safety-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-test:
    if: github.ref == 'refs/heads/test-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile bot.py send_once.py sync_kakao_token.py tests/test_safety.py
      - name: Run offline safety tests
        env:
          OPENAI_API_KEY: ''
          KAKAO_REST_API_KEY: ''
          KAKAO_REFRESH_TOKEN: ''
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: python -m unittest discover -s tests -p 'test_safety.py' -v
