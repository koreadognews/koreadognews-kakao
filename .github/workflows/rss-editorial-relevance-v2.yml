name: Korean Pet Industry - Refine Domestic RSS Editorial Relevance (Test Only)
'on':
  push:
    branches: [test-safety]
    paths:
      - '.github/workflows/rss-editorial-relevance-v2.yml'
  workflow_dispatch:

# One-shot test-branch patch. Never edits main/daily.yml, sends Kakao,
# calls OpenAI, publishes an issue or changes the 20 RSS source list.
permissions:
  contents: write

concurrency:
  group: rss-archive-pilot-test-safety
  cancel-in-progress: false

jobs:
  refine-domestic-selection:
    if: github.ref == 'refs/heads/test-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout only test-safety branch
        uses: actions/checkout@v4
        with:
          ref: test-safety
          fetch-depth: 0
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install -r requirements.txt
      - name: Stage consistent editorial filter and persistent regression tests
        env:
          OPENAI_API_KEY: ''
          KAKAO_REST_API_KEY: ''
          KAKAO_REFRESH_TOKEN: ''
          KAKAO_CLIENT_SECRET: ''
        run: |
          python - <<'PY'
          from pathlib import Path

          feed_path=Path('feed_collector.py')
          src=feed_path.read_text(encoding='utf-8')
          classifier='''# Domestic editorial prefilter: candidate discovery only, NOT final approval.
          # Ground headline topic first: generic mentions buried in a summary of an
          # unrelated performance or crime must not become pet-industry news.
          _DOMESTIC_HEADLINE_PET = (
              '반려동물', '반려견', '반려묘', '애견', '애묘', '애완동물',
              '펫푸드', '펫테크', '펫산업', '펫보험', '펫용품', '펫숍',
              '펫샵', '펫', '강아지', '고양이', '유기동물', '동물등록',
              'pet food', 'petfood', 'pet tech', 'pet industry',
          )
          _GOVERNMENT_FEEDS = frozenset({
              '농림축산식품부 보도자료', '중소벤처기업부 보도자료',
              '행정안전부 보도자료', '서울시 내 손안에 서울',
          })
          _GOVERNMENT_SUMMARY_PET = (
              '반려동물', '반려견', '반려묘', '펫푸드', '펫테크', '펫산업',
              '애견', '애묘', '유기동물', '강아지', '고양이',
          )
          _INCIDENT_HEADLINE = (
              '사체', '주검', '학대', '죽은', '숨진', '사망',
              '유골함', '도살', '살해', '동물사건', '입건', '수사', '고발',
          )
          _INDUSTRY_HEADLINE = (
              '산업', '시장', '기업', '제조', '생산', '수출', '수입',
              '유통', '투자', '매출', '통계', '정책', '규제', '지원사업',
              '서비스', '사료', '간식', '펫푸드', '펫테크', '제품',
              '용품', '브랜드', '사업', '창업', '스타트업', '판매',
              '출시', '협약', '인력', '육성', '플랫폼', '개발',
              '가맹', '쇼핑', '매장', '보험', '특허',
          )
          _EVENT_HEADLINE = (
              '입양', '축제', '캠페인', '자선', '봉사', '문화행사', '박람회',
          )


          def classify_domestic(title, summary, publisher=''):
              """Return domestic_industry, domestic_supplement or None (not verified)."""
              title = (title or '').lower()
              summary = (summary or '').lower()
              topic = title + ' ' + summary
              if any(word in topic for word in BLOCKED_KO):
                  return None
              anchored = any(word in title for word in _DOMESTIC_HEADLINE_PET)
              if not anchored:
                  # Limited exception for official civic/government releases with a
                  # clearly identified pet topic in their summary.
                  if publisher not in _GOVERNMENT_FEEDS or not any(
                      word in summary for word in _GOVERNMENT_SUMMARY_PET
                  ):
                      return None
              # Accidents/crimes are excluded even if their teaser mentions an industry.
              if any(word in title for word in _INCIDENT_HEADLINE):
                  return None
              # Adoption/culture are supplemental unless the headline also describes a
              # concrete commercial/policy/industrial action.
              has_industry_headline = any(word in title for word in _INDUSTRY_HEADLINE)
              if any(word in title for word in _EVENT_HEADLINE) and not has_industry_headline:
                  return 'domestic_supplement'
              if has_industry_headline:
                  return 'domestic_industry'
              # Some short English headlines need the actual RSS summary for context;
              # official policy releases can also use an abbreviated headline.
              if (title.strip() in {'pet food', 'petfood', 'pet tech', 'pet industry'}
                      or publisher in _GOVERNMENT_FEEDS):
                  if any(word in summary for word in INDUSTRY_KO):
                      return 'domestic_industry'
              return 'domestic_supplement'


          '''
          anchor='\ndef parse_feed(xml_bytes, source, start, end):\n'
          if 'def classify_domestic(title, summary, publisher=' not in src:
              if src.count(anchor)!=1:
                  raise RuntimeError('Missing exact parse_feed insertion point: no changes')
              src=src.replace(anchor,'\n'+classifier+anchor,1)
          old='''        else:
                      if not any(word in topic for word in KEYWORDS_KO):
                          continue
                      if any(word in topic for word in BLOCKED_KO):
                          continue
                      category = 'domestic_industry' if any(word in topic for word in INDUSTRY_KO) else 'domestic_supplement'
          '''
          new='''        else:
                      category = classify_domestic(title, summary, source.get('publisher', ''))
                      if category is None:
                          continue
          '''
          if old in src:
              src=src.replace(old,new,1)
          elif new not in src:
              raise RuntimeError('Missing expected legacy domestic selection: no changes')
          feed_path.write_text(src,encoding='utf-8')
          archive_path=Path('rss_archive.py')
          s=archive_path.read_text(encoding='utf-8')
          oldimp='from feed_collector import parse_feed, KEYWORDS_KO\n'
          newimp='from feed_collector import parse_feed, classify_domestic\n'
          if oldimp in s:s=s.replace(oldimp,newimp,1)
          elif newimp not in s:raise RuntimeError('Archive import changed unexpectedly')
          oldblock='''                # Re-screen old RSS archives, as well as new feeds, for explicit pet context.
                          if category in ('domestic_industry', 'domestic_supplement'):
                              topic = (rec.get('title', '') + ' ' + rec.get('summary', '')).lower()
                              if not any(term in topic for term in KEYWORDS_KO):
                                  continue
          '''
          newblock='''                # Apply the same relevance and category rules to older stored
                          # RSS candidates without deleting or rewriting historical files.
                          if category in ('domestic_industry', 'domestic_supplement'):
                              category = classify_domestic(rec.get('title', ''),
                                                           rec.get('summary', ''),
                                                           rec.get('publisher', ''))
                              if category is None:
                                  continue
          '''
          if oldblock in s:s=s.replace(oldblock,newblock,1)
          elif newblock not in s:raise RuntimeError('Unexpected archive replay filter: no changes')
          archive_path.write_text(s,encoding='utf-8')
          print('DOMESTIC_RELEVANCE_PATCH_STAGED',flush=True)
          PY
          mkdir -p tests
          cat > tests/test_domestic_relevance.py <<'PY'
          """Offline-only editorial screening tests; no user messages or network calls."""
          import datetime as dt
          import tempfile
          import unittest
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from xml.sax.saxutils import escape
          from feed_collector import classify_domestic, parse_feed
          from rss_archive import _write_day, load_for_issue


          class DomesticRelevanceTests(unittest.TestCase):
              def test_classification_examples(self):
                  checks = [
                      ('"분명 유골함까지 받았는데"…발견된 반려견 사체', '펫산업 관계자 반응', '한국경제 전체 추가시험', None),
                      ('애견유치원 학대, 영국 독일 사례', '시장 분석 및 정부 제도 조사', '헤럴드경제 전체 추가시험', None),
                      ('말없이 펼쳐지는 사랑의 세계…연극 멜로드라마 열차', '고양이가 나오는 연극 소개', '뉴시스 문화 추가시험', None),
                      ('국산 라이신 수출 확대', '일반 사료 제조와 축산 농가', '뉴시스 산업', None),
                      ('대구사이버대·한국동물보건학회, 반려동물산업 전문인력 양성 업무협약 체결', '', '헤럴드경제 전체 추가시험', 'domestic_industry'),
                      ('반려동물 사료 제조공장 신규 투자', '제품 생산 확대', '뉴시스 산업', 'domestic_industry'),
                      ('펫테크 스타트업, 반려동물 위치추적 제품 출시', '신기술 개발', '한국경제 전체 추가시험', 'domestic_industry'),
                      ('반려견 입양 문화행사 열린다', '보호소 입양 안내', '뉴시스 문화 추가시험', 'domestic_supplement'),
                      ('고양이와 함께 산책하는 문화 행사', '생활 문화', '뉴시스 지방', 'domestic_supplement'),
                      ('정부, 펫푸드 수출 지원 정책 발표', '', '농림축산식품부 보도자료', 'domestic_industry'),
                      ('우리지역 가을맞이 시민 소식', '반려동물 입양 문화행사가 예정', '서울시 내 손안에 서울', 'domestic_supplement'),
                      ('새로운 시장 성장 지원 방안', '반려동물 용품 수출 지원', '농림축산식품부 보도자료', 'domestic_industry'),
                      ('Pet food', '반려동물 사료 산업', 'Example News', 'domestic_industry'),
                  ]
                  for title, summary, publisher, expected in checks:
                      with self.subTest(title=title):
                          self.assertEqual(classify_domestic(title, summary, publisher), expected)

              def test_rss_and_archived_items_share_screening(self):
                  tz = ZoneInfo('Asia/Seoul')
                  start = dt.datetime(2026, 11, 6, 6, tzinfo=tz)
                  end = dt.datetime(2026, 11, 7, 6, tzinfo=tz)
                  titles = [
                      '반려동물 사료 제조기업 투자 확대',
                      '반려견 입양 문화행사 개최',
                      '반려견 사체 발견, 경찰 조사',
                      '연극 멜로드라마 열차 개막',
                  ]
                  summaries = ['기업 투자 확대', '동물 보호', '펫산업 관계자 반응', '고양이 등장']
                  feed={'publisher':'뉴시스 문화 추가시험','category':'domestic','hosts':['www.newsis.com']}
                  xml='<rss><channel>' + ''.join(
                      '<item><title>{}</title><link>https://www.newsis.com/view/{}</link>'
                      '<pubDate>Fri, 06 Nov 2026 12:00:00 +0900</pubDate>'
                      '<description>{}</description></item>'.format(escape(t),i,escape(s))
                      for i,(t,s) in enumerate(zip(titles,summaries))
                  ) + '</channel></rss>'
                  rows=parse_feed(xml.encode('utf-8'),feed,start,end)
                  self.assertEqual([x[0] for x in rows],['domestic_industry','domestic_supplement'])
                  with tempfile.TemporaryDirectory() as temp:
                      saved=[]
                      for i,(title,summary) in enumerate(zip(titles,summaries)):
                          saved.append({'title':title,'summary':summary,
                                        'url':'https://www.newsis.com/view/'+str(i),
                                        'publisher':feed['publisher'],'published_at':'2026-11-06T12:00:00+09:00',
                                        'category':'domestic_industry'})
                      _write_day(Path(temp),dt.date(2026,11,6),saved)
                      replay=load_for_issue(dt.date(2026,11,7),archive_dir=Path(temp))
                      self.assertEqual(len(replay['domestic_industry']),1)
                      self.assertEqual(len(replay['domestic_supplement']),1)
                      self.assertIn('사료',replay['domestic_industry'][0]['title'])
                      self.assertIn('입양',replay['domestic_supplement'][0]['title'])

          if __name__=='__main__':
              unittest.main()
          PY
      - name: Validate all existing and new tests (no network / AI / Kakao)
        env:
          OPENAI_API_KEY: ''
          KAKAO_REST_API_KEY: ''
          KAKAO_REFRESH_TOKEN: ''
          KAKAO_CLIENT_SECRET: ''
        run: |
          python -m py_compile bot.py feed_collector.py rss_archive.py tests/test_domestic_relevance.py
          python rss_archive.py --selftest
          python -m unittest discover -s tests -p 'test_*.py' -v
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from rss_archive import load_for_issue
          from feed_collector import classify_domestic
          feeds=json.loads(Path('feeds.json').read_text(encoding='utf-8'))['feeds']
          assert len(feeds)==20, 'Expected preserved 20 configured sources'
          assert len({f['url'] for f in feeds})==20
          assert classify_domestic('반려견 사체 발견', '사료 시장 반응', '한국경제 전체 추가시험') is None
          assert classify_domestic('반려동물 사료 수출 확대', '신제품 생산', '뉴시스 산업') == 'domestic_industry'
          date=dt.date(2026,11,7)
          rows=load_for_issue(date)
          print('EDITORIAL_REPLAY_REPORT '+json.dumps({
              'date':str(date),'domestic_industry':len(rows['domestic_industry']),
              'domestic_supplement':len(rows['domestic_supplement']),
              'overseas':len(rows['overseas']),
              'preserved_rss_sources':len(feeds),
          },ensure_ascii=False),flush=True)
          print('EDITORIAL_RELEVANCE_TESTS_PASSED',flush=True)
          PY
      - name: Commit validated changes to test-safety only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- feed_collector.py rss_archive.py tests/test_domestic_relevance.py
          if git diff --cached --quiet; then
            echo 'EDITORIAL_RELEVANCE_ALREADY_PRESENT'
            exit 0
          fi
          git commit -m 'Reduce unrelated domestic RSS hits and align archive replay [skip ci]'
          git pull --rebase origin test-safety
          git push origin HEAD:test-safety
          echo 'EDITORIAL_RELEVANCE_COMMITTED_TEST_SAFETY_ONLY'
