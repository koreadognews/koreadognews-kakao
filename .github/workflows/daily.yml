name: Korean Pet Industry Daily

'on':
  schedule:
    - cron: '30 21 * * *' # 06:30 KST; collection cutoff 06:00 KST
  workflow_dispatch:
    inputs:
      send_kakao:
        description: 'Send Kakao message?'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: koreadognews-pages
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      OPENAI_MODEL: gpt-5-mini
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate unified canonical newsletter
        run: python bot.py
      - name: Archive canonical source and published pages
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Archive Korean Pet Industry issue [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify newsletter URL
        shell: bash
        run: |
          python - <<'PY'
          import os, time, datetime, requests
          from zoneinfo import ZoneInfo
          issue = datetime.datetime.now(ZoneInfo('Asia/Seoul')).date()
          news_date = issue - datetime.timedelta(days=1)
          base = os.environ['PUBLIC_BASE_URL'].rstrip('/')
          expected_html = f'{base}/{news_date}.html'
          expected_json = f'{base}/issues/{issue}.json'
          for i in range(20):
              try:
                  a = requests.get(expected_html, params={'verify':i}, timeout=20)
                  b = requests.get(expected_json, params={'verify':i}, timeout=20)
                  if a.ok and f'기사 기준일 {news_date}' in a.text and b.ok and b.json().get('issue_date') == str(issue):
                      print('Canonical JSON and public HTML verified',flush=True)
                      break
                  print(f'Waiting: HTML {a.status_code}, JSON {b.status_code}',flush=True)
              except (requests.RequestException,ValueError) as e:
                  print(f'Waiting: {type(e).__name__}',flush=True)
              time.sleep(15)
          else:
              raise RuntimeError('Canonical edition not publicly available; Kakao send cancelled')
          PY
      - name: Check token update permission
        if: ${{ inputs.send_kakao == true || github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api repos/koreadognews/koreadognews-kakao/actions/secrets/public-key > /dev/null
      - name: Send Kakao message
        if: ${{ inputs.send_kakao == true || github.event_name == 'schedule' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python send_once.py
      - name: Save renewed Kakao token
        if: ${{ always() && (inputs.send_kakao == true || github.event_name == 'schedule') }}
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python sync_kakao_token.py
