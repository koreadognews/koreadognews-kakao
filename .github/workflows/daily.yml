
name: Korean Pet Industry Daily


'on':
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      send_kakao:
        description: 'Send Kakao message?'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pages: write
  id-token: write


concurrency:
  group: koreadognews-pages
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      OPENAI_MODEL: gpt-5-mini

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate newsletter
        run: python bot.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      
      - name: Verify newsletter URL
        shell: bash
        run: |
          python - <<'PY'
          import os
          import time
          import datetime
          import requests
          from zoneinfo import ZoneInfo

          day = (
              datetime.datetime.now(ZoneInfo("Asia/Seoul")).date()
              - datetime.timedelta(days=1)
          ).isoformat()

          base = os.environ["PUBLIC_BASE_URL"].rstrip("/")
          url = f"{base}/{day}.html"

          print(f"Checking newsletter: {url}", flush=True)

          for attempt in range(1, 21):
              try:
                  response = requests.get(
                      url,
                      timeout=20,
                      headers={"Cache-Control": "no-cache"},
                      params={"verify": str(attempt)}
                  )

                  print(
                      f"Attempt {attempt}: HTTP {response.status_code}",
                      flush=True
                  )

                  if (
                      response.status_code == 200
                      and f"기사 기준일 {day}" in response.text
                  ):
                      print("Newsletter page verified successfully.")
                      break

              except requests.RequestException as error:
                  print(f"Attempt {attempt}: {error}", flush=True)

              time.sleep(15)
          else:
              raise RuntimeError(
                  f"Newsletter page unavailable or wrong date: {url}"
              )
          PY


      
      - name: Check token update permission
        if: ${{ inputs.send_kakao == true || github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api repos/koreadognews/koreadognews-kakao/actions/secrets/public-key > /dev/null
     
      - name: Send Kakao message
        if: ${{ inputs.send_kakao == true || github.event_name == 'schedule' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python send_once.py

      - name: Save renewed Kakao token
        if: ${{ always() && (inputs.send_kakao == true || github.event_name == 'schedule') }}
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python sync_kakao_token.py
